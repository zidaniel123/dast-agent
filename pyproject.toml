[project]
name = "dast-agent"
version = "0.1.0"
description = "Autonomous DAST agent: authenticated walk -> pentest on the OpenAI Agents SDK + Playwright MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # openai-agents is pre-1.0 and its constructor keywords are load-bearing
    # here (MCPServerStdio, OpenAIChatCompletionsModel, Agent(output_type=),
    # Runner.run(max_turns=)), so the major range is bounded deliberately.
    "openai-agents>=0.2,<1.0",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

# Version ranges here express intent; uv.lock pins the exact resolved versions
# and their artifact hashes. Install with `uv sync --locked` so the lockfile is
# enforced rather than silently re-resolved.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# This is an application, not a library: install the dependencies, do not build
# and install the project itself. Run it with `uv run python main.py`.
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Flat layout: main.py / config.py / schemas.py live at the repo root.
pythonpath = ["."]
